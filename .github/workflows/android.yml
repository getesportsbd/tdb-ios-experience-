name: Build TDB iOS Experience APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Project
        run: |
          unzip -o TDB_iOS_Experience_Full_v1.1.zip -d extracted

      - name: Check Project
        run: |
          ls -la extracted
          test -f extracted/settings.gradle
          test -f extracted/app/build.gradle

      - name: Build APK
        run: |
          gradle -p extracted --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDB-iOS-Experience-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
